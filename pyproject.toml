[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm_evaluation"
version = "0.1.0"
description = "Evaluation helpers wrapping MLflow GenAI (datasets, scorers, LLM judges, Excel reports)"
requires-python = ">=3.11"
dependencies = [
    # Pin to the MLflow server version shipped with RHOAI once known.
    "mlflow>=3.10,<4",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_evaluation"]
